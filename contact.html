        <nav class="main-nav" id="main-nav">

    <main>
      <section
        class="hero"
        style="background-image: url('images/hero/hero-contact.jpg')"

        <div class="hero-inner">
          <h1 class="hero-title">Contact</h1>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="contact-grid">
            <div class="contact-block">
              <h3>Get in touch</h3>
              <p><strong>Mohammed Aslam Villan</strong></p>
              <p>Department of Chemistry</p>
              <p>IIT Bombay, India</p>
              <p>
                Email:
                <a href="mailto:aslamvillan22@gmail.com"
                  >aslamvillan22@gmail.com</a
                >
              </p>
            </div>

            <div>
              <h3>Location</h3>
              <div style="height: 260px; border-radius: 0.75rem; overflow: hidden;">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3771.5!2d72.9175!3d19.1334!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7c9a6b5b5b5b5%3A0x5b5b5b5b5b5b5b5b!2sIIT%20Bombay!5e0!3m2!1sen!2sin!4v1620000000000!5m2!1sen!2sin"

    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      // Mobile hamburger menu toggle
      (function () {
        var toggle = document.getElementById("menu-toggle");
        var nav = document.getElementById("main-nav");
        if (!toggle || !nav) return;

        function closeMenu() {
          toggle.classList.remove("menu-toggle--open");
          nav.classList.remove("nav-open");
        }

        toggle.addEventListener("click", function () {
          toggle.classList.toggle("menu-toggle--open");
          nav.classList.toggle("nav-open");
        });

        var navLinks = nav.querySelectorAll(".nav-link");
        navLinks.forEach(function (link) {
          link.addEventListener("click", function () {
            if (window.innerWidth <= 768) {
              closeMenu();
            }
          });
        });

        window.addEventListener("resize", function () {
          if (window.innerWidth > 768) {
            closeMenu();
          }
        });
      })();
    </script>
  </body>
</html>
